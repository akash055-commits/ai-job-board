name: Refresh Job Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Export job snapshot
        env:
          DATABASE_URL: file:./dev.db
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          JOB_REFRESH_SECRET: local-github-action
          SCRAPE_MODE: demo
          VERIFY_LINKS: "false"
          APP_BASE_URL: http://localhost:3000
          SERPAPI_ENABLE: "true"
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_BASE_URL: https://serpapi.com/search.json
          SERPAPI_ENGINE: google_jobs
          SERPAPI_GOOGLE_DOMAIN: google.com
          SERPAPI_GL: in
          SERPAPI_HL: en
          SERPAPI_MAX_PAGES: "1"
          SERPAPI_NO_CACHE: "false"
          SERPAPI_LOCATIONS: Gurugram, Haryana, India||Bengaluru, Karnataka, India||Remote
          SERPAPI_QUERIES: growth manager startup||performance marketing manager meta google||growth product manager||product manager growth||founder's office growth||growth associate high ownership
        run: npm run jobs:export

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.snapshot.json data/jobs.snapshot.meta.json
          git diff --cached --quiet || git commit -m "chore: refresh job snapshot"
          git push
